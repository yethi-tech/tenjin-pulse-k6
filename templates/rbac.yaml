apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-pt-service-sa
  namespace: {{ .Release.Namespace }}

# ============================================================
# NAMESPACE-SCOPED ROLE
# ============================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-pt-service-role
  namespace: {{ .Release.Namespace }}

rules:

  # ==========================================================
  # PODS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # POD LOGS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

  # ==========================================================
  # POD STATUS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - pods/status
    verbs:
      - get
      - update
      - patch

  # ==========================================================
  # SERVICES
  # ==========================================================
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # ENDPOINTS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch

  # ==========================================================
  # CONFIGMAPS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # SECRETS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # PERSISTENT VOLUME CLAIMS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # PVC STATUS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims/status
    verbs:
      - get
      - update
      - patch

  # ==========================================================
  # EVENTS
  # ==========================================================
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - get
      - list
      - watch

  # ==========================================================
  # ENDPOINT SLICES
  # ==========================================================
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  # ==========================================================
  # DEPLOYMENTS
  # ==========================================================
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # DEPLOYMENT STATUS
  # ==========================================================
  - apiGroups: ["apps"]
    resources:
      - deployments/status
    verbs:
      - get
      - update
      - patch

  # ==========================================================
  # STATEFULSETS
  # ==========================================================
  - apiGroups: ["apps"]
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # STATEFULSET STATUS
  # ==========================================================
  - apiGroups: ["apps"]
    resources:
      - statefulsets/status
    verbs:
      - get
      - update
      - patch

  # ==========================================================
  # REPLICASETS
  # ==========================================================
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

  # ==========================================================
  # JOBS
  # ==========================================================
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # JOB STATUS
  # ==========================================================
  - apiGroups: ["batch"]
    resources:
      - jobs/status
    verbs:
      - get
      - update
      - patch

  # ==========================================================
  # CRONJOBS
  # ==========================================================
  - apiGroups: ["batch"]
    resources:
      - cronjobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete


# ============================================================
# CLUSTER-SCOPED ROLE
# Required for PV / StorageClass operations
# ============================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-pt-service-cluster-role

rules:

  # ==========================================================
  # PERSISTENT VOLUMES
  # ==========================================================
  - apiGroups: [""]
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # ==========================================================
  # STORAGE CLASSES
  # ==========================================================
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete


# ============================================================
# ROLE BINDING
# ============================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-pt-service-rolebinding
  namespace: {{ .Release.Namespace }}

subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-pt-service-sa
    namespace: {{ .Release.Namespace }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-pt-service-role


# ============================================================
# CLUSTER ROLE BINDING
# Required for PV / StorageClass permissions
# ============================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-pt-service-cluster-rolebinding

subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-pt-service-sa
    namespace: {{ .Release.Namespace }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-pt-service-cluster-role