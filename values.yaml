db:
  POSTGRES_DB: tenjin
  driver: org.postgresql.Driver
  username: postgres
  password: postgres
  database: tenjin
  type: postgres
  accessMode: ReadWriteOnce
  storageClassName: standard
  size: 20Gi

InfluxDB:
  url: <influxdb_url>
  token: <influxdb_token>

  username: <influxdb_username>
  password: <influxdb_password>
  org: Yethi
  bucket: jmeter
  retention: 30d

k6Service:
  image: registry.yethi.in/products/tenjin-pulse/tenjin-pt/tenjin-k6-service:test

  persistence:
    size: 20Gi
    storageClassName: "nfs-storage"

  allowedExtensions: ""

  workerCount: 3

  workerImage: ""

  workerImagePullSecret: ""

  executionStorageClaim: ""

  workerCpuRequest: ""

  workerCpuLimit: ""

  workerMemoryRequest: ""

  workerMemoryLimit: ""

  workerReadyTimeoutSeconds: 180

  monitorIntervalMs: 15000

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

litmus:
  serviceUrl: http://<litmus-ip>:<litmus-port>
  serviceToken: <litmus-token>

tenjinStandalone:
  image: registry.yethi.in/products/tenjin-pulse/tenjin-pt/tenjin-pt-standalone:test
  baseUrl: <tenjin-standalone-url>
  mailHost: smtp.office365.com
  mailPort: 587
  mailUsername: ""
  mailPassword: "1C3cr$%cr3am"
  chaosTesting: "true"
  timezone: Asia/Kolkata
  cookieHttp: "false"
  cookieSecure: "false"
  cookieSite: strict

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080